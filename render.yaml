services:
  - type: web
    name: shree-datta-dental-care
    runtime: node
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm start
    envVars:
      - key: DATABASE_URL
        value: file:./prisma/clinic.db
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
