services:
  - type: web
    name: shree-datta-dental-care
    runtime: node
    buildCommand: npm ci && npx prisma generate && npx prisma generate --schema prisma/cloud/schema.prisma && npm run build
    startCommand: npx prisma migrate deploy --schema prisma/cloud/schema.prisma && npx prisma db seed && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
