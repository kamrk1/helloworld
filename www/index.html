<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E6B6F" />
    <title>SDC Clinic</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f5f2;
        color: #0f172a;
        font-family: system-ui, sans-serif;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        text-align: center;
        max-width: 22rem;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.25rem;
        border-radius: 18px;
        background: #0e6b6f;
        display: grid;
        place-items: center;
      }
      h1 {
        margin: 0 0 0.4rem;
        font-size: 1.35rem;
        color: #0e6b6f;
      }
      p {
        margin: 0;
        color: #475569;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40" fill="none">
          <path d="M32 14c-7 8-11 14-11 21a11 11 0 1 0 22 0c0-7-4-13-11-21z" fill="#F7F5F2" />
          <path d="M32 22c-4 5-6 9-6 13a6 6 0 1 0 12 0c0-4-2-8-6-13z" fill="#C9A35B" />
        </svg>
      </div>
      <h1>Clinic Admin</h1>
      <p>Opening the staff calendar…</p>
    </main>
  </body>
</html>
