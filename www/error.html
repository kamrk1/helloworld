<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E6B6F" />
    <title>Can’t reach server — SDC Clinic</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f5f2;
        color: #0f172a;
        font-family: system-ui, sans-serif;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      main {
        max-width: 26rem;
        background: #fff;
        border-radius: 1.25rem;
        padding: 1.75rem;
        box-shadow: 0 8px 30px rgba(14, 107, 111, 0.08);
      }
      h1 {
        margin: 0 0 0.5rem;
        color: #0e6b6f;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 1rem;
        color: #475569;
        line-height: 1.45;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.75rem;
        background: #0e6b6f;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 0.7rem 1.1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can’t reach the clinic server</h1>
      <p>
        The Android app is a shell around the live clinic calendar. This device could not load
        <strong>/login</strong>. Check the connection and try again.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        window.location.href = "https://proud-truth-84df.kamrk1.workers.dev/login";
      });
    </script>
  </body>
</html>
